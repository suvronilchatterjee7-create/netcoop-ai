description: >
  Sweep parameters for building the labelled synthetic dataset from the
  organiser's telemetry generator. Ground-truth labels always come from the
  generator's own scenario parameters (Part C1.6), never from hand-picked output.

scenario_families:
  catalog:
    - normal
    - link_congestion
    - weak_wifi
    - interface_fault
    - dns_dhcp_failure
    - interop_failure
  rationale: >
    The six test-scenario families the system must support. Names are our
    canonical labels; the mapping from the organiser generator's own scenario
    identifiers to these labels lives in data/mappings/generator_scenarios.yaml
    once the generator is integrated.
  source: "Problem statement A6 (test scenarios to support)"

ambiguity_suite:
  families:
    catalog: [interface_fault, hardware_failure, device_overload]
    rationale: >
      Courtroom evaluation suite (docs/COURTROOM.md). interface_fault naturally competes with
      hardware_failure on the same device; hardware_failure and device_overload are catalogue
      faults that the main sweep never injects, so the correlator has no positive training
      examples for them. They are deliberately kept OUT of the main sweep and the fit, so the
      suite measures behaviour on faults the learned model has never seen.
    source: "Part D Phase 6 exit criterion (generated ambiguous cases); problem statement A1"
  seeds:
    value: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
    unit: "rng seed"
    rationale: "Fresh seeds never used in development, calibration or fitting (also addresses Q-005)."
    source: "Engineering choice (disjoint from sweep.seeds)"
  intensities:
    value: [0.5, 1.0]
    unit: "fraction of maximum fault severity"
    rationale: "Clearly present faults: the suite tests adjudication between explanations, not detection limits."
    source: "Engineering choice"
  noise_levels:
    value: [0.0, 0.1]
    unit: "fraction (relative noise amplitude)"
    rationale: "Clean and moderate noise."
    source: "Engineering choice"

sweep:
  seeds:
    value: [0, 1, 2, 3, 4]
    unit: "rng seed"
    rationale: >
      Five independent seeds per (scenario, intensity, noise, missing) cell give
      1080 runs (180 per family, ~600 MB, ~1 min). Measured: each seed adds ~123 MB,
      so ten seeds would cost 1.2 GB for little extra spread. Topology and fault
      target also vary per run, so effective diversity is larger than the seed count.
    source: "Engineering choice for C1.6 (many seeds, no cherry-picking); open question in docs/DECISIONS.md"
  intensities:
    value: [0.25, 0.5, 0.75, 1.0]
    unit: "fraction of generator's maximum fault severity"
    rationale: >
      Evenly spaced severity levels so evaluation can show accuracy vs fault
      strength, including weak faults where abstention may be correct. Will be
      remapped to the generator's native severity parameter once known.
    source: "Engineering choice for Phase 8 robustness curves; pending generator API"
  noise_levels:
    value: [0.0, 0.1, 0.25]
    unit: "fraction (relative noise amplitude)"
    rationale: "Clean, moderate and heavy noise, to measure degradation under noisy telemetry (A1)."
    source: "Engineering choice for Phase 8 robustness curves; pending generator API"
  missing_rates:
    value: [0.0, 0.1, 0.3]
    unit: "fraction of records/fields dropped"
    rationale: >
      No, moderate and heavy missingness, to verify graceful degradation and
      that 'insufficient_evidence' fires as data degrades (Phase 5 exit criteria).
    source: "Engineering choice for Phase 5/8; pending generator API"
  base_seed:
    value: 20261031
    unit: "rng seed"
    rationale: "Root seed for any randomness owned by NetCoop itself (e.g. train/test split), for reproducibility (C1.8)."
    source: "Arbitrary fixed constant; any fixed value satisfies C1.8"

split:
  holdout_fraction:
    value: 0.3
    unit: "fraction of seeds"
    rationale: >
      Seeds, not individual records, are split into train/holdout so weights and
      calibration fitted on train are evaluated on unseen generator draws.
      30% holdout balances calibration-set size against evaluation-set size.
    source: "Common practice for small-sample calibration (Phase 5 task 1-2)"
