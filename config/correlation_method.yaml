description: >
  Hand-set parameters of the correlation method (docs/SCORING.md section 4). The fitted
  model itself (likelihood ratios, Platt parameters, decision thresholds) is GENERATED by
  `netcoop fit` into config/correlation.yaml from training seeds only.

estimation:
  laplace_alpha:
    value: 1.0
    unit: "pseudo-counts per status"
    rationale: "Laplace smoothing so no status ever has probability 0 (an unseen status must not yield an infinite log-likelihood ratio)."
    source: "Laplace (add-one) smoothing, standard for naive-Bayes count estimates"
  shrinkage_strength:
    value: 20.0
    unit: "pseudo-observations"
    rationale: >
      Per-(fault, element) status rates are shrunk toward the pooled rate of all elements with
      the same (role, expect): p = (n_s + k * p_pool) / (N + k). With k = 20, an element needs
      a few dozen labelled candidates before its own rate dominates; faults with no positive
      training examples (device_overload, hardware_failure) fall back to pooled behaviour.
    source: "Empirical-Bayes partial pooling (beta-binomial shrinkage)"
  platt_l2:
    value: 0.001
    unit: "ridge penalty on Platt parameters"
    rationale: "Numerical safeguard: keeps the Platt fit finite when training candidates are perfectly separable; negligible otherwise."
    source: "Standard ridge-regularised logistic regression"
  quality_bins:
    value: 3
    unit: "quantile bins"
    rationale: "Evidence quality enters as a categorical feature (tertiles of training candidates), so its effect on truth is learned rather than assumed."
    source: "Engineering choice (tertiles keep >= 1/3 of data per bin)"
  significant_clue_bins:
    value: [0, 1, 3]
    unit: "lower edges of bins of the number of significant clues in a run"
    rationale: "Used only for the 'no fault' decision: none / a few / several unexplained anomalies."
    source: "Engineering choice; effect estimated from data per bin"

decision:
  target_precision:
    value: 0.9
    unit: "fraction of decisions that are correct (training seeds)"
    rationale: >
      Accept, margin and 'no fault' thresholds are the most permissive ones whose decisions are
      at least 90% correct on the training seeds. 90% makes a claimed root cause trustworthy
      for a human operator while leaving room to answer most clear incidents; everything
      else is reported as insufficient evidence (problem statement A2).
    source: "Operating-point choice; thresholds derived from training data by grid search (netcoop fit)"
  margin_grid:
    value: [0.0, 0.5, 1.0, 2.0, 3.0, 4.6, 6.9]
    unit: "calibrated log-odds difference between best and runner-up candidate"
    rationale: >
      Separation thresholds searched when fitting, in calibrated log-odds (a likelihood-ratio
      gap of e^m between the two best explanations; 4.6 ~ 100:1, 6.9 ~ 1000:1). Log-odds are
      used rather than probabilities because calibrated probabilities saturate near 1, where
      a probability difference cannot tell two strong candidates apart. Below the fitted
      margin the case is a near tie for the courtroom.
    source: "Grid for the training-data search; likelihood-ratio interpretation of log-odds"
  min_accept:
    value: 0.5
    unit: "calibrated confidence"
    rationale: "A root cause is never claimed below 50% calibrated confidence, whatever the training search allows: below that it is more likely wrong than right."
    source: "Definition of 'probable' root cause"

calibration:
  ece_bins:
    value: 10
    unit: "equal-width confidence bins"
    rationale: "Standard binning for expected calibration error and the reliability diagram."
    source: "Guo et al. (2017), On Calibration of Modern Neural Networks"

fitting:
  workers:
    value: 4
    unit: "processes"
    rationale: "Training/holdout pipelines are independent per run; 4 processes fit a laptop."
    source: "Engineering choice"
  runs_stride:
    value: 1
    unit: "use every n-th run"
    rationale: "1 = use every generated run of the split (no sub-sampling); raise only for quick experiments."
    source: "Engineering choice (C1.6: report over the full suite)"
